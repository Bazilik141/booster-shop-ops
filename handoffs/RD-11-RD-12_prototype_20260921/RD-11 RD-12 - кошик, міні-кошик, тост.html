<style>
html,body{margin:0;padding:0;background:var(--bs-bg);font-family:'Manrope',system-ui,sans-serif;color:var(--bs-ink-2)}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer}
a{color:var(--bs-blue);text-decoration:none}
a:hover{color:#16306e}
code{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.92em;background:var(--bs-line-2);padding:1px 5px;border-radius:4px}
@keyframes rdSlideDown{from{transform:translateY(-100%);opacity:.4}to{transform:translateY(0);opacity:1}}
@keyframes rdFadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.bs-mock ::-webkit-scrollbar{width:8px;height:8px}
.bs-mock ::-webkit-scrollbar-thumb{background:rgba(17,24,39,.18);border-radius:8px}
</style>
</head>
