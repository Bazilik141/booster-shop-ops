// ── 404 page content ──────────────────────────────────────────────────────────
function Content404({ mobile=false, tone='ironic', showSearch=true, showCats=true }) {
  const heading = tone === 'ironic' ? 'Цю сторінку видалено з колоди' : 'Сторінку не знайдено';
  const body    = tone === 'ironic'
    ? 'Схоже, ця картка вже не в нашій колоді — її видалили, переклали або вона ніколи й не існувала. Спробуйте пошук або оберіть категорію нижче.'
    : 'На жаль, сторінку, яку Ви шукаєте, не знайдено. Ймовірно, Ви вказали неіснуючу адресу або сторінку було видалено, переміщено чи вона тимчасово недоступна.';
  const illu = mobile ? 300 : 400;
  const cats = ['Pokémon TCG','One Piece TCG','Yu-Gi-Oh!','Аксесуари'];

  return (
    <div style={{padding: mobile ? '28px 20px 40px' : '40px 0 56px',display:'flex',flexDirection:'column',alignItems:'center',gap:0,fontFamily:FF,color:C.ink2}}>
      <div style={{width:illu,maxWidth:'100%'}}><Illustration404 size={illu}/></div>

      <div style={{marginTop:6,textAlign:'center',display:'flex',flexDirection:'column',alignItems:'center',gap:10,maxWidth: mobile ? 340 : 500}}>
        <h1 style={{fontSize: mobile ? 22 : 27,fontWeight:800,color:C.blue,letterSpacing:'-0.02em',lineHeight:1.2}}>{heading}</h1>
        <p style={{fontSize: mobile ? 14 : 15,color:C.ink3,lineHeight:1.65,maxWidth: mobile ? 320 : 450,textWrap:'pretty'}}>{body}</p>
      </div>

      {showSearch && (
        <div style={{marginTop:22,width: mobile ? '100%' : 420,maxWidth:'100%'}}>
          <div style={{display:'flex',alignItems:'center',gap:9,background:C.paper,border:`1.5px solid ${C.line}`,borderRadius:10,padding:'11px 14px',cursor:'text'}}>
            <IcoSearch/><span style={{fontSize:13.5,color:C.ink4}}>Пошук бустерів, сетів, виробників...</span>
          </div>
        </div>
      )}

      <div style={{marginTop: showSearch ? 14 : 26,display:'flex',gap:10,flexDirection: mobile ? 'column' : 'row',width: mobile ? '100%' : 'auto',alignItems:'center'}}>
        <button style={{height:48,padding:'0 28px',background:C.green,color:'#fff',border:'none',borderRadius:999,fontFamily:FF,fontSize:14.5,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8,width: mobile ? '100%' : 'auto',boxShadow:'0 4px 16px -4px rgba(22,163,74,0.42)'}}>
          <IcoArrow/> На головну
        </button>
        <button style={{height:48,padding:'0 28px',background:C.paper,border:`1.5px solid ${C.line}`,color:C.ink2,borderRadius:999,fontFamily:FF,fontSize:14.5,fontWeight:600,cursor:'pointer',width: mobile ? '100%' : 'auto'}}>
          Продовжити покупки
        </button>
      </div>

      {showCats && (
        <div style={{marginTop:24,display:'flex',flexDirection:'column',alignItems:'center',gap:10}}>
          <span style={{fontSize:12.5,color:C.ink4,fontWeight:500}}>Або перейдіть до:</span>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',justifyContent:'center'}}>
            {cats.map(c => <span key={c} style={{padding:'6px 14px',borderRadius:999,background:C.blueSoft,color:C.blue,fontSize: mobile ? 12.5 : 13,fontWeight:600,cursor:'pointer'}}>{c}</span>)}
          </div>
        </div>
      )}
    </div>
  );
}

// ── Full pages ─────────────────────────────────────────────────────────────────
function Page404Desktop(p) {
  return (
    <div style={{width:1280,background:C.bg,fontFamily:FF}}>
      <HeaderDesktop/>
      <Breadcrumb/>
      <div style={{display:'flex',justifyContent:'center'}}>
        <div style={{width:'100%',maxWidth:720}}><Content404 tone={p.tone} showSearch={p.showSearch} showCats={p.showCats}/></div>
      </div>
    </div>
  );
}
function Page404Mobile(p) {
  return (
    <div style={{width:390,background:C.bg,fontFamily:FF}}>
      <HeaderMobile/>
      <Content404 mobile tone={p.tone} showSearch={p.showSearch} showCats={p.showCats}/>
    </div>
  );
}

// ── Browser frame (auto-scales) ───────────────────────────────────────────────
const PAGE_W=1280, PAGE_H=820;

function BrowserFrame({ children }) {
  const [scale, setScale] = useState(0.55);
  const ref = useRef(null);
  useEffect(() => {
    const calc = () => { if (!ref.current) return; const w = ref.current.offsetWidth - 4; setScale(Math.max(0.3, Math.min(0.85, w / PAGE_W))); };
    calc();
    const ro = new ResizeObserver(calc);
    if (ref.current) ro.observe(ref.current);
    return () => ro.disconnect();
  }, []);
  const dw = Math.round(PAGE_W * scale), dh = Math.round(PAGE_H * scale);
  return (
    <div ref={ref} style={{width:'100%'}}>
      <div style={{borderRadius:10,overflow:'hidden',boxShadow:'0 20px 60px rgba(17,24,39,0.2), 0 4px 12px rgba(17,24,39,0.08)',display:'inline-flex',flexDirection:'column'}}>
        <div style={{height:36,background:'#2D2D2D',display:'flex',alignItems:'center',padding:'0 14px',gap:10,width:dw,flexShrink:0}}>
          <div style={{display:'flex',gap:5.5}}>{['#FF5F57','#FEBC2E','#28C840'].map(c=><div key={c} style={{width:11,height:11,borderRadius:'50%',background:c}}/>)}</div>
          <div style={{flex:1,background:'#1A1A1A',borderRadius:5,height:22,display:'flex',alignItems:'center',padding:'0 10px',gap:6}}>
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><circle cx="5" cy="5" r="4" stroke="#555" strokeWidth="1"/><path d="M5 1c.6 2 2 2.5 2 4s-1.4 2-2 4c-.6-2-2-2.5-2-4S4.4 3 5 1z" stroke="#555" strokeWidth="1"/><line x1="1" y1="5" x2="9" y2="5" stroke="#555" strokeWidth="1"/></svg>
            <span style={{fontSize:10.5,color:'#888',fontFamily:'system-ui,sans-serif'}}>boostershop.website/error?404</span>
          </div>
        </div>
        <div style={{width:dw,height:dh,overflow:'hidden',flexShrink:0}}>
          <div style={{width:PAGE_W,transform:`scale(${scale})`,transformOrigin:'top left',pointerEvents:'none'}}>{children}</div>
        </div>
      </div>
    </div>
  );
}

      <div style={{borderRadius:42,overflow:'hidden',background:C.bg}}>
        <div style={{height:50,background:C.paper,display:'flex',alignItems:'flex-end',padding:'0 22px 8px',position:'relative',justifyContent:'space-between',flexShrink:0}}>
          <span style={{fontSize:15,fontWeight:700,color:C.ink,fontFamily:FF,zIndex:1}}>9:41</span>
          <div style={{position:'absolute',top:8,left:'50%',transform:'translateX(-50%)',width:118,height:32,background:'#1C1C1E',borderRadius:20,zIndex:2}}/>
          <div style={{display:'flex',gap:4,alignItems:'center',zIndex:1}}>
            <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><rect x="0.5" y="5" width="3" height="7" rx="1" fill={C.ink}/><rect x="5" y="3" width="3" height="9" rx="1" fill={C.ink}/><rect x="9.5" y="1" width="3" height="11" rx="1" fill={C.ink}/><rect x="14" y="0" width="3" height="12" rx="1" fill={C.ink}/></svg>
            <svg width="25" height="13" viewBox="0 0 25 13" fill="none"><rect x="0.5" y="0.5" width="21" height="12" rx="3.5" stroke={C.ink} strokeWidth="1"/><rect x="2" y="2" width="16" height="9" rx="2" fill={C.ink}/><rect x="22.5" y="3.5" width="2" height="6" rx="1" fill={C.ink}/></svg>
          </div>
        </div>
        <div style={{maxHeight:660,overflowY:'auto',overflowX:'hidden'}}>{children}</div>
        <div style={{height:28,background:C.bg,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
          <div style={{width:130,height:5,background:C.ink,borderRadius:3,opacity:0.14}}/>
        </div>
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
const DEFAULTS = { tone:'ironic', showSearch:true, showCats:true };

function App() {
  const [tab, setTab] = useState('desktop');
  const [t, setTweak] = useTweaks(DEFAULTS);

  const tabBtn = (id, label) => (
    <button onClick={() => setTab(id)} style={{
      height:32, padding:'0 18px', border:'none', cursor:'pointer',
      borderRadius:999, fontFamily:FF, fontSize:13, fontWeight:600,
      background: tab===id ? C.blue : 'transparent',
      color:       tab===id ? '#fff' : C.ink3,
      transition:'background .15s, color .15s',
    }}>{label}</button>
  );

  return (
    <div style={{height:'100vh',display:'flex',flexDirection:'column',background:'#ECEAE6',fontFamily:FF,overflow:'hidden'}}>

      {/* Top bar */}
      <div style={{height:48,background:'rgba(236,234,230,0.97)',borderBottom:'1px solid #D1CEC8',display:'flex',alignItems:'center',padding:'0 20px',gap:12,flexShrink:0}}>
        <span style={{fontSize:13.5,fontWeight:800,color:C.ink,letterSpacing:'-0.01em',marginRight:4}}>404 — Сторінка не знайдена</span>
        <div style={{display:'flex',gap:3,background:'rgba(17,24,39,0.06)',borderRadius:999,padding:'3px'}}>
          {tabBtn('desktop','🖥 Desktop')}
          {tabBtn('mobile','📱 Mobile')}
        </div>
      </div>

      {/* Canvas */}
      <div style={{flex:1,overflow:'auto',display:'flex',alignItems:'center',justifyContent:'center',padding:32}}>
        {tab === 'desktop' && (
          <div style={{width:'100%',maxWidth:1060}}>
            <div style={{marginBottom:10,fontSize:11,fontWeight:600,color:C.ink4,letterSpacing:'0.08em',textTransform:'uppercase',textAlign:'center'}}>Desktop · 1280px</div>
            <BrowserFrame>
              <Page404Desktop tone={t.tone} showSearch={t.showSearch} showCats={t.showCats}/>
            </BrowserFrame>
          </div>
        )}
        {tab === 'mobile' && (
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:12}}>
            <div style={{fontSize:11,fontWeight:600,color:C.ink4,letterSpacing:'0.08em',textTransform:'uppercase'}}>Mobile · 390px</div>
            <PhoneFrame>
              <Page404Mobile tone={t.tone} showSearch={t.showSearch} showCats={t.showCats}/>
            </PhoneFrame>
          </div>
        )}
      </div>

      {/* Tweaks */}
      <TweaksPanel title="Tweaks">
        <TweakSection label="Копірайт"/>
        <TweakRadio label="Тон" value={t.tone}
          options={[{value:'ironic',label:'Ігровий'},{value:'neutral',label:'Нейтральний'}]}
          onChange={v=>setTweak('tone',v)}/>
        <TweakSection label="Елементи"/>
        <TweakToggle label="Рядок пошуку" value={t.showSearch} onChange={v=>setTweak('showSearch',v)}/>
        <TweakToggle label="Категорії"    value={t.showCats}   onChange={v=>setTweak('showCats',v)}/>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
