<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="design_doc_mode" content="canvas">
<title>Оплатити частинами — disabled стан</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
html,body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#EDEDEA}
.frame{position:absolute;top:40px;width:480px}
.frame__label{font-size:12px;font-weight:700;color:#8a8a86;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.frame__label.bad{color:#B45309}
.frame__label.good{color:#15803D}
.card{background:#fff;border:1px solid var(--bs-line);border-radius:var(--bs-r-lg);box-shadow:var(--bs-sh-sm);padding:22px}
.card__head{display:flex;align-items:center;gap:10px;padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--bs-line-2)}
.card__head span{width:30px;height:30px;border-radius:var(--bs-r-sm);background:var(--bs-line-2);display:flex;align-items:center;justify-content:center;color:var(--bs-ink-2);flex:0 0 auto}
.card__head h2{margin:0;font-size:16px;font-weight:700;color:var(--bs-ink)}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1.5px solid var(--bs-line);border-radius:var(--bs-r-sm)}
.row input{margin-top:2px;flex:0 0 auto;accent-color:var(--bs-blue)}
.row__body{flex:1;min-width:0}
.row__label{display:block;font-size:14px;font-weight:600;color:var(--bs-ink)}
.row__sub{font-size:12px;color:var(--bs-ink-3);margin-top:2px}
.row--disabled{background:var(--bs-bg);cursor:not-allowed}
.row--disabled .row__label{color:var(--bs-ink-4)}
.row--disabled input{accent-color:var(--bs-ink-4)}
.row--broken .row__label{display:inline}
.row--broken .row__sub{display:inline;margin:0}
.hint{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12.5px;color:var(--bs-ink-3);line-height:1.4}
.hint svg{flex:0 0 auto;color:var(--bs-ink-4)}
</style>
</head>
<body>

<div class="frame" style="left:40px">
<div class="frame__label bad">Зараз — баг</div>
<div class="card">
<div class="card__head"><span><svg width="15" height="15" viewBox="0 0 20 20" fill="none"><rect x="2" y="4.5" width="16" height="11" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M2 8.2h16" stroke="currentColor" stroke-width="1.4"/></svg></span><h2>Оплата</h2></div>
<div class="rows">
<label class="row"><input type="radio" name="a" checked><div class="row__body"><span class="row__label">Картка, Google Pay / Apple Pay</span><div class="row__sub">Безпечно через еквайринг</div></div></label>
<label class="row"><input type="radio" name="a"><div class="row__body"><span class="row__label">Оплата при отриманні (накладений платіж)</span></div></label>
<label class="row"><input type="radio" name="a"><div class="row__body"><span class="row__label">За реквізитами на IBAN</span></div></label>
<label class="row row--disabled row--broken"><input type="radio" name="a" disabled><div class="row__body"><span class="row__label">Оплатити частинами</span><span class="row__sub">Будь ласка, заповніть дані отримувача і адресу доставки</span></div></label>
</div>
</div>
</div>

<div class="frame" style="left:560px">
<div class="frame__label good">Пропоновано</div>
<div class="card">
<div class="card__head"><span><svg width="15" height="15" viewBox="0 0 20 20" fill="none"><rect x="2" y="4.5" width="16" height="11" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M2 8.2h16" stroke="currentColor" stroke-width="1.4"/></svg></span><h2>Оплата</h2></div>
<div class="rows">
<label class="row"><input type="radio" name="b" checked><div class="row__body"><span class="row__label">Картка, Google Pay / Apple Pay</span><div class="row__sub">Безпечно через еквайринг</div></div></label>
<label class="row"><input type="radio" name="b"><div class="row__body"><span class="row__label">Оплата при отриманні (накладений платіж)</span></div></label>
<label class="row"><input type="radio" name="b"><div class="row__body"><span class="row__label">За реквізитами на IBAN</span></div></label>
<label class="row row--disabled"><input type="radio" name="b" disabled><div class="row__body"><span class="row__label">Оплатити частинами</span><div class="hint"><svg width="13" height="13" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.2" stroke="currentColor" stroke-width="1.3"/><path d="M8 7.3v3.6M8 5.3v.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Будь ласка, заповніть дані отримувача і адресу доставки</div></div></label>
</div>
</div>
</div>

</body>
</html>
