<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Блок інфо під назвою товару: 4 варіанти</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
body{margin:0;background:var(--bs-bg)}
a{color:var(--bs-blue);text-decoration:none}a:hover{color:var(--bs-onepiece);text-decoration:underline}
.pp-bar{position:sticky;top:0;z-index:5;background:var(--bs-paper);border-bottom:1px solid var(--bs-line);padding:12px 20px;display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center}
.pp-bar__grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pp-bar__lbl{font-size:12px;font-weight:700;color:var(--bs-ink-3);text-transform:uppercase;letter-spacing:.05em}
.pp-seg{display:inline-flex;border:1px solid var(--bs-line);border-radius:var(--bs-r-sm);overflow:hidden;background:var(--bs-paper)}
.pp-seg button{border:0;background:transparent;padding:8px 12px;font-size:13px;font-weight:600;color:var(--bs-ink-2);border-right:1px solid var(--bs-line)}
.pp-seg button:last-child{border-right:0}
.pp-seg button[aria-pressed="true"]{background:var(--bs-ink);color:#fff}
.pp-desc{max-width:1180px;margin:0 auto;padding:20px 20px 0;font-size:13.5px;color:var(--bs-ink-3);line-height:1.55}
.pp-desc strong{color:var(--bs-ink)}
.pp-stage{max-width:1180px;margin:16px auto 48px;padding:0 20px;display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
.pp-frame{display:grid;gap:8px}
.pp-frame__cap{font-size:12px;font-weight:700;color:var(--bs-ink-3);text-transform:uppercase;letter-spacing:.05em}
.pp-dk{width:640px;max-width:100%;background:var(--bs-paper);border:1px solid var(--bs-line);border-radius:var(--bs-r-lg);padding:28px}
.pp-mb{width:375px;background:var(--bs-paper);border:1px solid var(--bs-line);border-radius:var(--bs-r-lg);padding:20px 16px}
.pp-title{margin:0;font-size:32px;line-height:1.2;font-weight:800;color:var(--bs-ink);letter-spacing:-.015em;text-wrap:pretty}
.m .pp-title{font-size:22px}
.pp-price{display:flex;align-items:baseline;gap:10px;margin-top:18px}
.pp-price b{font-size:34px;font-weight:800;color:var(--bs-ink);letter-spacing:-.02em}
.pp-price span{font-size:13px;color:var(--bs-ink-3)}
.pp-bulk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--bs-ink-3)}
.pp-bulk em{font-style:normal;background:var(--bs-gold-soft);border:1px solid #F1DFA2;color:var(--bs-warning-fg);font-weight:700;padding:3px 8px;border-radius:var(--bs-r-sm)}
.pp-rule{height:1px;background:var(--bs-line);margin-top:18px}
.pp-buy{display:flex;gap:10px;margin-top:14px}
.pp-step{display:inline-flex;align-items:center;border:1px solid var(--bs-line);border-radius:var(--bs-r-sm);height:48px}
.pp-step button{width:44px;height:46px;border:0;background:transparent;font-size:18px;color:var(--bs-ink-2)}
.pp-step span{min-width:28px;text-align:center;font-weight:700;color:var(--bs-ink)}
.pp-cta{flex:1;height:48px;border:0;border-radius:var(--bs-r-sm);background:var(--bs-green);color:#fff;font-weight:700;font-size:15px}
.pp-cta:hover{background:var(--bs-green-hover)}
.pp-cta:disabled{background:var(--bs-line-2);color:var(--bs-ink-3);cursor:not-allowed}
/* reviews button, three treatments */
.bs-mock .rv{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--bs-ink-2);text-decoration:none;transition:border-color .15s,background .15s,color .15s}
.bs-mock .rv:hover{text-decoration:none;color:var(--bs-ink)}
.rv svg.star{color:var(--bs-gold)}
.rv .arr{color:var(--bs-ink-4);transition:transform .15s,color .15s}
.rv:hover .arr{transform:translateX(2px);color:var(--bs-ink-2)}
.rv--pill{height:34px;padding:0 12px 0 10px;border:1px solid var(--bs-line);border-radius:var(--bs-r-pill);background:var(--bs-paper)}
.rv--pill:hover{border-color:var(--bs-gold);background:var(--bs-gold-soft)}
.m .rv--pill{height:40px;padding:0 14px 0 12px}
.rv--tile{padding:4px 10px 4px 4px;border-radius:var(--bs-r-pill);background:var(--bs-bg);border:1px solid transparent}
.rv--tile .ic{width:26px;height:26px;border-radius:999px;background:var(--bs-gold-soft);display:grid;place-items:center}
.rv--tile:hover{border-color:var(--bs-line);background:var(--bs-paper)}
.m .rv--tile{padding:7px 12px 7px 7px}
.bs-mock .rv--inline{color:var(--bs-blue);padding:6px 0}
.bs-mock .rv--inline:hover{color:var(--bs-onepiece)}
.rv--inline:hover .txt{text-decoration:underline;text-underline-offset:3px}
/* shared pieces */
.dot{width:8px;height:8px;border-radius:999px;flex:0 0 auto}
.lbl{color:var(--bs-ink-3);font-size:13px}
.val{color:var(--bs-ink);font-size:13.5px;font-weight:600}
.mf{color:var(--bs-blue);font-weight:600;font-size:13.5px}
/* A chips */
.a-wrap{display:grid;gap:12px;margin-top:14px}
.a-chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:var(--bs-r-pill);border:1px solid var(--bs-line);background:var(--bs-paper);font-size:13px;color:var(--bs-ink-2);white-space:nowrap}
.m .chip{height:36px}
.chip b{font-weight:700;color:var(--bs-ink)}
.chip--in{background:var(--bs-green-soft);border-color:#CDEBD8;color:var(--bs-green-hover)}
.chip--in b{color:var(--bs-green-hover)}
.chip--low{background:var(--bs-warning-bg);border-color:var(--bs-warning-line);color:var(--bs-warning-fg)}
.chip--low b{color:var(--bs-warning-fg)}
.chip--pre{background:var(--bs-warning-bg);border-color:var(--bs-warning-line);color:var(--bs-warning-fg);font-weight:700}
.chip--out{background:var(--bs-line-2);border-color:var(--bs-line-2);color:var(--bs-ink-3);font-weight:700}
.chip a{font-weight:600}
/* B status card */
.b-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;flex-wrap:wrap}
.b-card{display:flex;gap:12px;align-items:center;margin-top:14px;padding:12px 14px;border-radius:var(--bs-r);border:1px solid var(--bs-line)}
.b-card .ico{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;flex:0 0 auto}
.b-card .t{font-size:14.5px;font-weight:700;line-height:1.3}
.b-card .s{font-size:13px;color:var(--bs-ink-3);margin-top:2px;line-height:1.4}
.b-card .s strong{color:var(--bs-ink-2)}
.b-card--in{background:var(--bs-green-soft);border-color:#CDEBD8}.b-card--in .ico{background:#fff;color:var(--bs-green)}.b-card--in .t{color:var(--bs-green-hover)}
.b-card--low{background:var(--bs-warning-bg);border-color:var(--bs-warning-line)}.b-card--low .ico{background:#fff;color:var(--bs-warning-fg)}.b-card--low .t{color:var(--bs-warning-fg)}
.b-card--pre{background:var(--bs-warning-bg);border-color:var(--bs-warning-line)}.b-card--pre .ico{background:#fff;color:var(--bs-warning-fg)}.b-card--pre .t{color:var(--bs-warning-fg)}
.b-card--out{background:var(--bs-bg)}.b-card--out .ico{background:var(--bs-line-2);color:var(--bs-ink-3)}.b-card--out .t{color:var(--bs-ink-3)}
/* C clean table */
.c-tbl{margin:14px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px;border-top:1px solid var(--bs-line)}
.m .c-tbl{grid-template-columns:minmax(0,1fr)}
.c-row{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:12px;min-height:44px;border-bottom:1px solid var(--bs-line-2)}
.c-row dt{margin:0}.c-row dd{margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.c-stat{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700}
.c-tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:var(--bs-r-sm)}
/* D near price */
.d-meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:13px}
.d-meta .sep{width:1px;height:14px;background:var(--bs-line)}
.d-stat{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:13.5px;font-weight:600;flex-wrap:wrap}
.d-stat .sub{color:var(--bs-ink-3);font-weight:500}
.d-stat .sub strong{color:var(--bs-ink-2)}
</style>
</head>
<body class="bs-mock">
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const {useState,useEffect}=React;
const LOW=5;
const PRODUCTS={
  in:{title:'Бустер One Piece Card Game OP-16: The Time of Battle (Японське видання)',price:200,bulk:180,qty:18},
  low:{title:'Бустер One Piece Card Game OP-16: The Time of Battle (Японське видання)',price:200,bulk:180,qty:3},
  pre:{title:'Бустер One Piece Card Game OP-14 (Японське видання)',price:180,bulk:170},
  out:{title:'Бустер One Piece Card Game OP-10 (Японське видання)',price:190,bulk:170},
};
const ETA='3–4 тижні';
const money=v=>'₴'+v.toFixed(2);

const I={
  star:(s=13)=><svg className="star" width={s} height={s} viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><path d="M7 1.5l1.7 3.6L12.5 6 9.7 8.5l.8 4L7 10.5 3.5 12.5l.8-4L1.5 6l3.8-.9L7 1.5z"/></svg>,
  arr:(s=14)=><svg className="arr" width={s} height={s} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg>,
  check:(s=18)=><svg width={s} height={s} viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4.5 10.5l3.5 3.5 7.5-8"/></svg>,
  clock:(s=18)=><svg width={s} height={s} viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><circle cx="10" cy="10" r="7.25"/><path d="M10 6v4.2l2.8 1.8"/></svg>,
  box:(s=18)=><svg width={s} height={s} viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round"><path d="M3 6.5L10 3l7 3.5v7L10 17l-7-3.5z"/><path d="M3 6.5L10 10l7-3.5M10 10v7"/></svg>,
  x:(s=18)=><svg width={s} height={s} viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M6 6l8 8M14 6l-8 8"/></svg>,
  truck:(s=16)=><svg width={s} height={s} viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round"><path d="M2 5h10v8H2zM12 8h3.5L18 10.5V13h-6z"/><circle cx="5.5" cy="14.5" r="1.5" fill="#fff"/><circle cx="14.5" cy="14.5" r="1.5" fill="#fff"/></svg>,
};

// Status palette: in = green (CTA-green family), low = amber text, preorder = amber (as on live site), out = neutral
const TONE={
  in:{dot:'var(--bs-green)',fg:'var(--bs-green-hover)',bg:'var(--bs-green-soft)'},
  low:{dot:'var(--bs-gold)',fg:'var(--bs-warning-fg)',bg:'var(--bs-warning-bg)'},
  pre:{dot:'var(--bs-gold)',fg:'var(--bs-warning-fg)',bg:'var(--bs-warning-bg)'},
  out:{dot:'var(--bs-ink-4)',fg:'var(--bs-ink-3)',bg:'var(--bs-line-2)'},
};
const statusWord=(st,p)=>st==='in'?'В наявності':st==='low'?`Залишилось ${p.qty} шт`:st==='pre'?'Передзамовлення':'Закінчився';

const Rev=({kind})=>{
  const go=e=>e.preventDefault();
  if(kind==='tile')return <a href="#tab-review" onClick={go} className="rv rv--tile"><span className="ic">{I.star(13)}</span><span>Відгуки про нас</span>{I.arr(13)}</a>;
  if(kind==='inline')return <a href="#tab-review" onClick={go} className="rv rv--inline">{I.star(13)}<span className="txt">Відгуки про нас</span>{I.arr(13)}</a>;
  return <a href="#tab-review" onClick={go} className="rv rv--pill">{I.star(14)}<span>Відгуки про нас</span>{I.arr(13)}</a>;
};
const Mf=()=><a href="#" onClick={e=>e.preventDefault()} className="mf">Bandai</a>;

/* A — chip row */
function VarA({st,p}){
  const cls={in:'chip--in',low:'chip--low',pre:'chip--pre',out:'chip--out'}[st];
  return <div className="a-wrap">
    <div><Rev kind="pill"/></div>
    <div className="a-chips">
      {st==='in'&&<span className={'chip '+cls}><span className="dot" style={{background:TONE.in.dot}}></span>В наявності · <b>{p.qty} шт</b></span>}
      {st==='low'&&<span className={'chip '+cls}><span className="dot" style={{background:TONE.low.dot}}></span>Залишилось <b>{p.qty} шт</b></span>}
      {st==='pre'&&<><span className={'chip '+cls}><span className="dot" style={{background:TONE.pre.dot}}></span>Передзамовлення</span>
        <span className="chip">{I.truck(15)}Доставка орієнтовно <b>{ETA}</b></span></>}
      {st==='out'&&<span className={'chip '+cls}>{I.x(14)}Закінчився</span>}
      <span className="chip"><span className="lbl">Виробник</span><Mf/></span>
    </div>
  </div>;
}

/* B — status card with icon */
function VarB({st,p}){
  const ico={in:I.check(),low:I.box(),pre:I.clock(),out:I.x()}[st];
  const t={in:'В наявності',low:'Залишилось мало',pre:'Передзамовлення',out:'Закінчився'}[st];
  const s={in:<><strong>{p.qty} шт</strong> на складі</>,low:<>Лишилось <strong>{p.qty} шт</strong> на складі</>,pre:<>Доставка орієнтовно <strong>{ETA}</strong></>,out:<>Товару немає в наявності</>}[st];
  return <>
    <div className="b-top"><Rev kind="tile"/><span style={{display:'inline-flex',gap:8,alignItems:'center'}}><span className="lbl">Виробник</span><Mf/></span></div>
    <div className={'b-card b-card--'+st}><span className="ico">{ico}</span><div><div className="t">{t}</div><div className="s">{s}</div></div></div>
  </>;
}

/* C — clean table */
function VarC({st,p}){
  const T=TONE[st];
  const stat=st==='pre'
    ? <span className="c-tag" style={{background:T.bg,color:T.fg,border:'1px solid var(--bs-warning-line)'}}>Передзамовлення</span>
    : st==='out'
    ? <span className="c-tag" style={{background:T.bg,color:T.fg}}>Закінчився</span>
    : <span className="c-stat" style={{color:T.fg}}><span className="dot" style={{background:T.dot}}></span>{st==='in'?'В наявності':'Залишилось'}<span style={{color:'var(--bs-ink)'}}>{p.qty} шт</span></span>;
  return <>
    <div style={{marginTop:12}}><Rev kind="pill"/></div>
    <dl className="c-tbl">
      <div className="c-row"><dt className="lbl">Статус</dt><dd>{stat}</dd></div>
      <div className="c-row"><dt className="lbl">Виробник</dt><dd><Mf/></dd></div>
      {st==='pre'&&<div className="c-row"><dt className="lbl">Доставка</dt><dd className="val"><span style={{color:'var(--bs-ink-3)',fontWeight:500}}>орієнтовно</span> {ETA}</dd></div>}
    </dl>
  </>;
}

/* D — meta line under title, status next to price/buy */
function VarD({st,p}){
  const T=TONE[st];
  return <div className="d-meta"><span style={{display:'inline-flex',gap:6,alignItems:'center'}}><span className="lbl">Виробник</span><Mf/></span><span className="sep"></span><Rev kind="inline"/></div>;
}
function DStatus({st,p}){
  const T=TONE[st];
  return <div className="d-stat" style={{color:T.fg}}>
    <span className="dot" style={{background:T.dot}}></span>{statusWord(st,p)}
    {st==='in'&&<span className="sub">· <strong>{p.qty} шт</strong> на складі</span>}
    {st==='pre'&&<span className="sub">· доставка орієнтовно <strong>{ETA}</strong></span>}
  </div>;
}

function Card({v,st,mobile}){
  const p=PRODUCTS[st];
  const [q,setQ]=useState(1);
  const V={A:VarA,B:VarB,C:VarC,D:VarD}[v];
  return <div className={mobile?'pp-mb m':'pp-dk'}>
    <h1 className="pp-title">{p.title}</h1>
    <V st={st} p={p}/>
    <div className="pp-price"><b>{money(p.price)}</b><span>/ 1 шт</span></div>
    <div className="pp-bulk"><span>від 5 шт —</span><em>{money(p.bulk)} за штуку</em></div>
    {v==='D'&&<DStatus st={st} p={p}/>}
    <div className="pp-buy" style={v==='D'?{marginTop:10}:{marginTop:18}}>
      {st!=='out'&&<div className="pp-step"><button onClick={()=>setQ(Math.max(1,q-1))} aria-label="Менше">−</button><span>{q}</span><button onClick={()=>setQ(p.qty?Math.min(p.qty,q+1):q+1)} aria-label="Більше">+</button></div>}
      <button className="pp-cta" disabled={st==='out'}>{st==='out'?'Немає в наявності':st==='pre'?'Передзамовити':'Купити'}</button>
    </div>
  </div>;
}

const VARS={
  A:{name:'Рядок чипів',d:<>Без таблиці. Статус, термін доставки і виробник стоять пігулками в один рядок, який переноситься. «Відгуки про нас» стає окремою кнопкою-пігулкою із зіркою, на hover отримує золотий фон.</>},
  B:{name:'Картка статусу',d:<>Статус подано карткою з іконкою: заголовок і пояснення під ним. Кількість або термін доставки видно одразу. Виробник і «Відгуки» винесено в один рядок над карткою.</>},
  C:{name:'Легка таблиця',d:<>Та сама структура, що зараз, але без заливок і з тонкими лініями. На десктопі 2 колонки, на мобайлі 1, висота рядка 44 px. Кнопку «Відгуки» зроблено пігулкою.</>},
  D:{name:'Статус біля ціни',d:<>Під назвою лишається тільки рядок «Виробник · Відгуки про нас». Статус з кількістю або терміном стоїть над кнопкою купівлі, у точці ухвалення рішення.</>},
};
const STATES=[['in','В наявності (18)'],['pre','Передзамовлення'],['out','Закінчився']];

function App(){
  const init=JSON.parse(localStorage.getItem('rdpp-meta')||'{}');
  const [v,setV]=useState(init.v||'B');
  const [st,setSt]=useState(init.st==='low'?'in':(init.st||'in'));
  useEffect(()=>{localStorage.setItem('rdpp-meta',JSON.stringify({v,st}))},[v,st]);
  return <>
    <div className="pp-bar">
      <div className="pp-bar__grp"><span className="pp-bar__lbl">Варіант</span>
        <div className="pp-seg">{Object.keys(VARS).map(k=><button key={k} aria-pressed={v===k} onClick={()=>setV(k)}>{k} · {VARS[k].name}</button>)}</div></div>
      <div className="pp-bar__grp"><span className="pp-bar__lbl">Статус</span>
        <div className="pp-seg">{STATES.map(([k,l])=><button key={k} aria-pressed={st===k} onClick={()=>setSt(k)}>{l}</button>)}</div></div>
    </div>
    <p className="pp-desc"><strong>{v} · {VARS[v].name}.</strong> {VARS[v].d}</p>
    <div className="pp-stage" data-screen-label={'Variant '+v}>
      <div className="pp-frame"><span className="pp-frame__cap">Десктоп · колонка інфо</span><Card key={'d'+v+st} v={v} st={st}/></div>
      <div className="pp-frame"><span className="pp-frame__cap">Мобайл · 375</span><Card key={'m'+v+st} v={v} st={st} mobile/></div>
    </div>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
