<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>H1 та Trust Strip — варіанти</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

/* ─── Tokens ─────────────────────────────────────────── */
const G    = '#C68A00';
const GS   = '#FBF4DC';
const BS   = '#1E3A8A';
const BSS  = '#E8EEFB';
const BG   = '#F7F7F5';
const PP   = '#FFFFFF';
const INK  = '#111827';
const INK3 = '#6B7280';
const INK4 = '#9CA3AF';
const LINE = '#E5E7EB';
const LN2  = '#EEF0F2';
const GRN  = '#16A34A';
const FF   = "'Manrope', system-ui, sans-serif";
const FFM  = "'JetBrains Mono', monospace";

/* ─── Icons ──────────────────────────────────────────── */
const IcShield = ({ s = 18, c = G }) => (
  <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
    <polyline points="9,12 11,14 15,10" />
  </svg>
);
const IcZap = ({ s = 18, c = G }) => (
  <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
    <polygon points="13,2 3,14 12,14 11,22 21,10 12,10 13,2" />
  </svg>
);
const IcSend = ({ s = 18, c = G }) => (
  <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
    <line x1="22" y1="2" x2="11" y2="13" />
    <polygon points="22,2 15,22 11,13 2,9 22,2" />
  </svg>
);
const IcAward = ({ s = 18, c = G }) => (
  <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
    <circle cx="12" cy="8" r="6" />
    <polyline points="8.21,13.89 7,23 12,20 17,23 15.79,13.88" />
  </svg>
);
const IcTruck = ({ s = 18, c = G }) => (
  <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
    <rect x="1" y="3" width="15" height="13" rx="1" />
    <path d="M16 8h4l3 3v5h-7V8z" />
    <circle cx="5.5" cy="18.5" r="2.5" />
    <circle cx="18.5" cy="18.5" r="2.5" />
  </svg>
);
const ICONS = { shield: IcShield, zap: IcZap, send: IcSend, award: IcAward, truck: IcTruck };

const TRUST = [
  { key: 'shield', label: 'Гарантія оригінальності', sub: 'офіційний канал постачання' },
  { key: 'zap',    label: 'Швидка доставка',          sub: 'по всій Україні' },
  { key: 'send',   label: 'Telegram підтримка',       sub: 'відповідаємо швидко' },
  { key: 'truck',  label: 'Привеземо під замовлення', sub: 'будь-який товар під запит' },
];

const Dot = () => (
  <span style={{ margin: '0 6px', color: INK4 }}>·</span>
);

/* ════════════════════════════════════════════
   H1 Variant A — Eyebrow + золоте слово TCG
   ════════════════════════════════════════════ */
function H1_A({ mob }) {
  const pad = mob ? '22px 18px 28px' : '28px 48px 38px';
  const fs  = mob ? 28 : 42;
  const fss = mob ? 14 : 16;
  return (
    <div style={{ background: BG, padding: pad, fontFamily: FF }}>
      {/* eyebrow */}
      <div style={{
        fontFamily: FFM, fontSize: 11, letterSpacing: '0.14em',
        textTransform: 'uppercase', color: G, fontWeight: 500,
        marginBottom: 12, display: 'flex', alignItems: 'center', gap: 7,
      }}>
        <span style={{ width: 5, height: 5, background: G, transform: 'rotate(45deg)', display: 'inline-block', flexShrink: 0 }} />
        Офіційний TCG магазин
      </div>
      {/* heading */}
      <h1 style={{
        fontSize: fs, fontWeight: 800, letterSpacing: '-0.028em',
        lineHeight: 1.1, color: INK, margin: 0, textWrap: 'pretty',
      }}>
        Оригінальні бустери та бокси{' '}
        <span style={{ color: G }}>TCG</span>
      </h1>
      {/* subtitle */}
      <p style={{
        margin: '11px 0 0', fontSize: fss, fontWeight: 500,
        color: INK3, letterSpacing: '-0.01em', lineHeight: 1.4,
      }}>
        Pokémon <Dot /> One Piece <Dot /> та інші колекційні ігри
      </p>
    </div>
  );
}

/* ════════════════════════════════════════════
   H1 Variant B — Золота вертикальна смуга
   ════════════════════════════════════════════ */
function H1_B({ mob }) {
  const pad = mob ? '22px 18px 28px' : '28px 48px 38px';
  const fs  = mob ? 28 : 42;
  const fss = mob ? 14 : 16;
  return (
    <div style={{ background: BG, padding: pad, fontFamily: FF }}>
      <div style={{ borderLeft: `3px solid ${G}`, paddingLeft: mob ? 16 : 22 }}>
        <h1 style={{
          fontSize: fs, fontWeight: 800, letterSpacing: '-0.028em',
          lineHeight: 1.1, color: INK, margin: 0, textWrap: 'pretty',
        }}>
          Оригінальні бустери та бокси TCG
        </h1>
        <p style={{
          margin: '11px 0 0', fontSize: fss,
          fontWeight: 500, color: INK3, lineHeight: 1.4,
        }}>
          Pokémon <Dot /> One Piece <Dot /> та інші колекційні ігри
        </p>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════
   H1 Variant C — Градієнт gold→blue
   ════════════════════════════════════════════ */
function H1_C({ mob }) {
  const pad = mob ? '14px 18px 18px' : '16px 48px 20px';
  const fs  = mob ? 26 : 40;
  const fss = mob ? 13 : 16;
  const grad = `linear-gradient(135deg, ${GS} 0%, ${BSS} 100%)`;
  return (
    <div style={{
      background: grad,
      borderTop: '3px solid transparent',
      borderImage: `linear-gradient(to right, ${G}, ${BS}) 1`,
      padding: pad, fontFamily: FF,
    }}>
      <div style={{
        display: 'flex',
        alignItems: mob ? 'flex-start' : 'center',
        justifyContent: 'space-between',
        gap: 28,
      }}>
        <div>
          <h1 style={{
            fontSize: fs, fontWeight: 800, letterSpacing: '-0.028em',
            lineHeight: 1.1, color: INK, margin: 0, textWrap: 'pretty',
          }}>
            Оригінальні бустери та бокси{' '}
            <span style={{ color: G }}>TCG</span>
          </h1>
          <p style={{
            margin: '11px 0 0', fontSize: fss,
            fontWeight: 500, color: INK3, lineHeight: 1.4,
          }}>
            Pokémon <Dot /> One Piece <Dot /> та інші колекційні ігри
          </p>
        </div>
        {!mob && (
          <div style={{
            flexShrink: 0,
            background: 'rgba(255,255,255,0.65)',
            border: '1px solid rgba(0,0,0,0.07)',
            borderRadius: 12, padding: '12px 20px',
            textAlign: 'center', lineHeight: 1,
          }}>
            <div style={{
              fontSize: 10, color: INK3, marginBottom: 5,
              letterSpacing: '0.12em', textTransform: 'uppercase',
              fontFamily: FFM, fontWeight: 600,
            }}>Твій</div>
            <div style={{
              fontSize: 28, fontWeight: 800, color: G,
              letterSpacing: '-0.03em',
            }}>TCG</div>
            <div style={{
              fontSize: 10, color: INK3, marginTop: 5,
              letterSpacing: '0.1em', textTransform: 'uppercase',
              fontFamily: FFM,
            }}>магазин</div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════
   H1 Variant C — змінна градієнта
   ════════════════════════════════════════════ */
const GRAD_VARIANTS = [
  {
    id: 'soft',
    label: 'Поточний (base)',
    bg:     `linear-gradient(135deg, ${GS} 0%, ${BSS} 100%)`,
    border: `linear-gradient(to right, ${G}, ${BS}) 1`,
  },
  {
    id: 'rich',
    label: 'Насичений',
    bg:     'linear-gradient(135deg, #F2D663 0%, #93B8EC 100%)',
    border: 'linear-gradient(to right, #C68A00, #1E3A8A) 1',
  },
  {
    id: 'sharp',
    label: 'Різкий',
    bg:     'linear-gradient(135deg, #F5E898 30%, #AECAF2 70%)',
    border: 'linear-gradient(to right, #C68A00 30%, #1E3A8A 70%) 1',
  },
  {
    id: 'tinted',
    label: 'Тонований (over neutral)',
    bg:     `linear-gradient(160deg, rgba(198,138,0,0.22) 0%, ${BG} 48%, rgba(30,58,138,0.13) 100%)`,
    border: 'linear-gradient(to right, #C68A00, #3B82F6) 1',
  },
];

function H1_C_Var({ mob, grad }) {
  const pad = mob ? '14px 18px 18px' : '16px 48px 20px';
  const fs  = mob ? 26 : 40;
  const fss = mob ? 13 : 16;
  return (
    <div style={{
      background: grad.bg,
      borderTop: '3px solid transparent',
      borderImage: grad.border,
      padding: pad, fontFamily: FF,
    }}>
      <div style={{
        display: 'flex',
        alignItems: mob ? 'flex-start' : 'center',
        justifyContent: 'space-between',
        gap: 28,
      }}>
        <div>
          <h1 style={{
            fontSize: fs, fontWeight: 800, letterSpacing: '-0.028em',
            lineHeight: 1.1, color: INK, margin: 0, textWrap: 'pretty',
          }}>
            Оригінальні бустери та бокси{' '}
            <span style={{ color: G }}>TCG</span>
          </h1>
          <p style={{
            margin: '11px 0 0', fontSize: fss,
            fontWeight: 500, color: INK3, lineHeight: 1.4,
          }}>
            Pokémon <Dot /> One Piece <Dot /> та інші колекційні ігри
          </p>
        </div>
        {!mob && (
          <div style={{
            flexShrink: 0,
            background: 'rgba(255,255,255,0.65)',
            border: '1px solid rgba(0,0,0,0.07)',
            borderRadius: 12, padding: '12px 20px',
            textAlign: 'center', lineHeight: 1,
          }}>
            <div style={{
              fontSize: 10, color: INK3, marginBottom: 5,
              letterSpacing: '0.12em', textTransform: 'uppercase',
              fontFamily: FFM, fontWeight: 600,
            }}>Твій</div>
            <div style={{
              fontSize: 28, fontWeight: 800, color: G,
              letterSpacing: '-0.03em',
            }}>TCG</div>
            <div style={{
              fontSize: 10, color: INK3, marginTop: 5,
              letterSpacing: '0.1em', textTransform: 'uppercase',
              fontFamily: FFM,
            }}>магазин</div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════
   Trust Strip A — тонка інфо-стрічка
   Позиція: між хедером та H1
   ════════════════════════════════════════════ */
function TrustA({ mob }) {
  if (mob) {
    return (
      <div style={{
        background: '#F5F0E8',
        borderTop: `1px solid ${LINE}`,
        borderBottom: '2px solid rgba(198,138,0,0.35)',
        padding: '6px 16px', fontFamily: FF,
      }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '7px 0' }}>
          {TRUST.map((t, i) => {
            const Ic = ICONS[t.key];
            const right = i % 2 === 1;
            return (
              <div key={i} style={{
                display: 'flex', alignItems: 'center', gap: 5,
                paddingLeft: right ? 11 : 0,
                paddingRight: right ? 0 : 11,
                borderLeft: right ? `1px solid ${LINE}` : 'none',
              }}>
                <Ic s={11} c={G} />
                <span style={{
                  fontSize: 10.5, fontWeight: 600, color: INK,
                  lineHeight: 1.3, textWrap: 'balance',
                }}>{t.label}</span>
              </div>
            );
          })}
        </div>
      </div>
    );
  }
  return (
    <div style={{
      background: '#F5F0E8',
      borderTop: `1px solid ${LINE}`,
      borderBottom: '2px solid rgba(198,138,0,0.35)',
      fontFamily: FF,
    }}>
      <div style={{
        maxWidth: 1160, margin: '0 auto', padding: '0 48px',
        display: 'flex', alignItems: 'center', height: 36,
      }}>
        {TRUST.map((t, i) => {
          const Ic = ICONS[t.key];
          return (
            <React.Fragment key={i}>
              {i > 0 && (
                <div style={{ width: 1, height: 22, background: LINE, flexShrink: 0 }} />
              )}
              <div style={{
                flex: 1, display: 'flex', alignItems: 'center',
                justifyContent: 'center', gap: 8,
              }}>
                <Ic s={13} c={G} />
                <span style={{ fontSize: 12, fontWeight: 600, color: INK }}>
                  {t.label}
                </span>
              </div>
            </React.Fragment>
          );
        })}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════
   Trust Strip B — картки-факти
   Позиція: під H1, над категоріями
   ════════════════════════════════════════════ */
function TrustB({ mob }) {
  if (mob) {
    return (
      <div style={{ background: BG, padding: '0 16px 20px', fontFamily: FF }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
          {TRUST.map((t, i) => {
            const Ic = ICONS[t.key];
            return (
              <div key={i} style={{
                background: PP, border: `1px solid ${LINE}`,
                borderRadius: 10, padding: '15px 10px',
                display: 'flex', flexDirection: 'column',
                alignItems: 'center', textAlign: 'center', gap: 9,
              }}>
                <div style={{
                  width: 38, height: 38, borderRadius: '50%',
                  background: GS, display: 'flex',
                  alignItems: 'center', justifyContent: 'center',
                }}>
                  <Ic s={18} c={G} />
                </div>
                <div>
                  <div style={{ fontSize: 12, fontWeight: 700, color: INK, lineHeight: 1.3 }}>
                    {t.label}
                  </div>
                  <div style={{ fontSize: 11, color: INK3, marginTop: 3 }}>
                    {t.sub}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }
  return (
    <div style={{ background: BG, padding: '0 48px 28px', fontFamily: FF }}>
      <div style={{
        background: PP, border: `1px solid ${LINE}`,
        borderRadius: 12, display: 'flex', overflow: 'hidden',
      }}>
        {TRUST.map((t, i) => {
          const Ic = ICONS[t.key];
          return (
            <React.Fragment key={i}>
              {i > 0 && (
                <div style={{ width: 1, background: LINE, flexShrink: 0 }} />
              )}
              <div style={{
                flex: 1, display: 'flex', alignItems: 'center',
                gap: 14, padding: '20px 22px',
              }}>
                <div style={{
                  width: 42, height: 42, borderRadius: 10, flexShrink: 0,
                  background: GS, display: 'flex',
                  alignItems: 'center', justifyContent: 'center',
                }}>
                  <Ic s={20} c={G} />
                </div>
                <div>
                  <div style={{ fontSize: 14, fontWeight: 700, color: INK }}>
                    {t.label}
                  </div>
                  <div style={{ fontSize: 12, color: INK3, marginTop: 3 }}>
                    {t.sub}
                  </div>
                </div>
              </div>
            </React.Fragment>
          );
        })}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════
   Trust Strip V2 — White + gold rule
   ════════════════════════════════════════════ */
function TS_V2({ mob }) {
  if (mob) {
    return (
      <div style={{ background: PP, borderBottom: `3px solid ${G}`, padding: '7px 16px', fontFamily: FF }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '7px 0' }}>
          {TRUST.map((t, i) => {
            const Ic = ICONS[t.key]; const right = i % 2 === 1;
            return (
              <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 5, paddingLeft: right ? 11 : 0, paddingRight: right ? 0 : 11, borderLeft: right ? `1px solid ${LINE}` : 'none' }}>
                <Ic s={11} c={G} />
                <span style={{ fontSize: 10.5, fontWeight: 600, color: INK, lineHeight: 1.3 }}>{t.label}</span>
              </div>
            );
          })}
        </div>
      </div>
    );
  }
  return (
    <div style={{ background: PP, borderBottom: `3px solid ${G}`, fontFamily: FF }}>
      <div style={{ maxWidth: 1160, margin: '0 auto', padding: '0 48px', display: 'flex', alignItems: 'center', height: 36 }}>
        {TRUST.map((t, i) => {
          const Ic = ICONS[t.key];
          return (
            <React.Fragment key={i}>
              {i > 0 && <div style={{ width: 1, height: 22, background: LINE, flexShrink: 0 }} />}
              <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8 }}>
                <Ic s={13} c={G} />
                <span style={{ fontSize: 12, fontWeight: 600, color: INK }}>{t.label}</span>
              </div>
            </React.Fragment>
          );
        })}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════
   Trust Strip V3 — Dark band
   ════════════════════════════════════════════ */
const DARK_BG = '#1A1714';
const DARK_TX = '#F0EDE8';
function TS_V3({ mob }) {
  if (mob) {
    return (
      <div style={{ background: DARK_BG, padding: '7px 16px', fontFamily: FF }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '7px 0' }}>
          {TRUST.map((t, i) => {
            const Ic = ICONS[t.key]; const right = i % 2 === 1;
            return (
              <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 5, paddingLeft: right ? 11 : 0, paddingRight: right ? 0 : 11, borderLeft: right ? '1px solid rgba(255,255,255,0.12)' : 'none' }}>
                <Ic s={11} c={G} />
                <span style={{ fontSize: 10.5, fontWeight: 600, color: DARK_TX, lineHeight: 1.3 }}>{t.label}</span>
              </div>
            );
          })}
        </div>
      </div>
    );
  }
  return (
    <div style={{ background: DARK_BG, fontFamily: FF }}>
      <div style={{ maxWidth: 1160, margin: '0 auto', padding: '0 48px', display: 'flex', alignItems: 'center', height: 36 }}>
        {TRUST.map((t, i) => {
          const Ic = ICONS[t.key];
          return (
            <React.Fragment key={i}>
              {i > 0 && <div style={{ width: 1, height: 22, background: 'rgba(255,255,255,0.15)', flexShrink: 0 }} />}
              <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8 }}>
                <Ic s={13} c={G} />
                <span style={{ fontSize: 12, fontWeight: 600, color: DARK_TX }}>{t.label}</span>
              </div>
            </React.Fragment>
          );
        })}
      </div>
    </div>
  );
}

const SHARP = {
  bg:     'linear-gradient(135deg, #F5E898 30%, #AECAF2 70%)',
  border: 'linear-gradient(to right, #C68A00 30%, #1E3A8A 70%) 1',
};
const TsCtx = ({ mob, Strip }) => (
  <div style={{ background: BG }}>
    <MiniHdr mob={mob} />
    <Strip mob={mob} />
    <H1_C_Var mob={mob} grad={SHARP} />
  </div>
);

/* ─── Context helpers ─────────────────────────────────── */
const MiniHdr = ({ mob }) => (
  <div style={{
    background: PP, borderBottom: `1px solid ${LINE}`,
    padding: mob ? '11px 16px' : '11px 40px',
    display: 'flex', alignItems: 'center', gap: 12,
    fontFamily: FF,
  }}>
    <div style={{
      fontWeight: 800, fontSize: mob ? 13 : 14,
      color: G, letterSpacing: '-0.02em', lineHeight: 1,
    }}>BOOSTER SHOP</div>
    {!mob && (
      <div style={{
        flex: 1, height: 34, background: BG,
        border: `1px solid ${LINE}`, borderRadius: 8, marginLeft: 8,
      }} />
    )}
    <div style={{
      marginLeft: 'auto', background: GRN, color: PP,
      borderRadius: 8, padding: mob ? '6px 10px' : '7px 16px',
      fontSize: mob ? 12 : 13, fontWeight: 700, flexShrink: 0,
    }}>Кошик</div>
  </div>
);

const H1Stub = ({ mob }) => (
  <div style={{
    background: BG,
    padding: mob ? '18px 16px 22px' : '22px 48px 28px',
    fontFamily: FF,
  }}>
    <h1 style={{
      fontSize: mob ? 24 : 36, fontWeight: 800,
      letterSpacing: '-0.025em', lineHeight: 1.1, color: INK,
      margin: 0, textWrap: 'pretty',
    }}>
      Оригінальні бустери та бокси{' '}
      <span style={{ color: G }}>TCG</span>
